name: Build Mod Release v0.2.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

concurrency:
  group: pbz-release-v0.2.2
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: v0.2.2
      PACKAGE: PBZ-OutfitFrameworkCombined-v0.2.2.zip
      PATCH_PACKAGE: PBZ-OutfitFrameworkCombined-v0.2.2-menu-patch.zip
    steps:
      - name: Check out the source
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download and verify Git LFS objects
        run: |
          git lfs version
          git lfs pull
          git lfs fsck
          node tools/verify.cjs

      - name: Build installation ZIP
        run: |
          mkdir -p dist
          zip -q -r -1 "dist/$PACKAGE" ProjectPBZ README.md
          unzip -tq "dist/$PACKAGE"
          zip -q -r -1 "dist/$PATCH_PACKAGE" ProjectPBZ/Content/JavaScript UPGRADE-v0.2.2.md
          unzip -tq "dist/$PATCH_PACKAGE"
          (cd dist && sha256sum "$PACKAGE" > "$PACKAGE.sha256" && sha256sum "$PATCH_PACKAGE" > "$PATCH_PACKAGE.sha256")
          {
            echo '### Verified installation package'
            echo
            echo '24 runtime JavaScript modules, 41 appearance checks, 38 menu lifecycle checks, 72 cooked assets.'
            echo
            echo 'ZIP integrity and source asset hashes checked.'
            echo 'In-game compatibility is not verified.'
            echo
            cat "dist/$PACKAGE.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft pre-release with verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite its assets."
            exit 1
          fi
          gh release create "$TAG" "dist/$PACKAGE" "dist/$PACKAGE.sha256" "dist/$PATCH_PACKAGE" "dist/$PATCH_PACKAGE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PBZ Outfit Framework Combined v0.2.2" \
            --draft --prerelease \
            --notes "Menu compatibility candidate. Full ZIP includes all 24 original cooked asset triplets. The smaller menu-patch ZIP replaces both Mods Menu script folders for v0.2.0/v0.2.1 users. Restores the original Studio native finish/init sequence, repairs both native tab caches, and writes PBZCombined-menu.log. Atelier input ownership is coordinated. CI validates asset hashes, 79 simulated checks and ZIP integrity. In-game compatibility remains unverified. Review upstream authors' distribution permissions before publishing."
